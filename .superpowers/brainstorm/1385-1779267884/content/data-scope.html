<h2>数据真实度</h2>
<p class="subtitle">决定仪表盘的信息价值和开发工作量</p>

<div class="options">
  <div class="option" data-choice="real" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>真实数据（推荐）</h3>
      <p>Sparkline 展示近 7 天资产/告警变化趋势，告警趋势图按天统计，活动时间线从审计日志实时拉取。需要后端新增 2-3 个聚合 API，但仪表盘真正有监控价值。</p>
    </div>
  </div>
  <div class="option" data-choice="mixed" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>混合方案</h3>
      <p>统计卡片用真实数据（总数、在线数等已有），Sparkline 和趋势图用装饰性占位，活动时间线用真实审计日志。开发量适中，核心数据真实，图表后续再补。</p>
    </div>
  </div>
  <div class="option" data-choice="decoration" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>纯装饰</h3>
      <p>所有图表和趋势都是静态占位，只改视觉样式不改数据逻辑。开发最快，但仪表盘只是好看，没有额外信息价值。</p>
    </div>
  </div>
</div>
