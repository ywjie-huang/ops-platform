# Copy the command from ../README.md to create the actual Secret. This file is
# intentionally not included by kustomization.yaml and must never contain real
# credentials.
apiVersion: v1
kind: Secret
metadata:
  name: ops-secrets
  namespace: ops-platform
type: Opaque
stringData:
  MYSQL_PASSWORD: replace-me
  REDIS_PASSWORD: replace-me
  SECRET_KEY: replace-with-a-long-random-value
